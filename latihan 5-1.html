<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata Siswa</title>
    <link rel="stylesheet" href="latihan3.css">
</head>
<body>
    <div class="background-glow"></div>

    <div class="form-container">
        <div class="form-header">
            <h3>Haikal Putra Lesmana XI TKJ 2</h3>
            <h1>Form Biodata Siswa</h1>
            <p>Sistem Pendataan Akademik Terpadu</p>
        </div>

        <form>
            <div class="input-group">
                <label for="nisn">NISN</label>
                <input type="text" id="nisn" name="nisn" placeholder="Masukan NISN" required>
            </div>

            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukan nama lengkap" required>
            </div>

            <div class="input-group">
                <label for="kelas">Kelas</label>
                <select id="kelas" name="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X">X</option>
                    <option value="XI">XI</option>
                    <option value="XII">XII</option>
                </select>
            </div>

            <div class="input-group">
                <label class="group-label">Jurusan</label>
                <div class="options-grid">
                    <div class="option-wrapper">
                        <input type="checkbox" id="akl" name="jurusan" value="AKL">
                        <label for="akl">AKL</label>
                    </div>
                    <div class="option-wrapper">
                        <input type="checkbox" id="mplb" name="jurusan" value="MPLB"> 
                        <label for="mplb">MPLB</label>
                    </div>
                    <div class="option-wrapper">
                        <input type="checkbox" id="tjkt" name="jurusan" value="TJKT">
                        <label for="tjkt">TJKT</label>
                    </div>
                    <div class="option-wrapper">
                        <input type="checkbox" id="tkr" name="jurusan" value="TKR"> 
                        <label for="tkr">TKR</label>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="tempat">Tempat Lahir</label>
                <input type="text" id="tempat" name="tempat" placeholder="Tempat lahir" required>
            </div>

            <div class="input-group">
                <label for="tanggal">Tanggal Lahir</label>
                <input type="date" id="tanggal" name="tanggal" required>
            </div>

            <div class="input-group">
                <label class="group-label">Jenis Kelamin</label>
                <div class="options-grid gender-grid">
                    <div class="option-wrapper">
                        <input type="radio" id="laki" name="gender" value="Laki-laki">
                        <label for="laki">Laki-laki</label>
                    </div>
                    <div class="option-wrapper">
                        <input type="radio" id="perempuan" name="gender" value="Perempuan">
                        <label for="perempuan">Perempuan</label> 
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="alamat">Alamat</label>
                <input type="text" id="alamat" name="alamat" placeholder="Masukkan alamat" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email" required>
            </div>

            <button type="submit" class="submit-btn">
                <span>Submit Data</span>
            </button>
        </form>
    </div>
</body>
</html>
